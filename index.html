<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>
        window.onload = function() {
            const userAgent = navigator.userAgent.toLowerCase();
          
            const chromeStore = "https://chromewebstore.google.com/detail/afjklofdihcdbbbmppgbigjmkclglcbc?utm_source=item-share-cb";
            const firefoxStore = "https://addons.mozilla.org/ru/firefox/addon/%D0%BB%D1%83%D1%87%D1%88%D0%B0%D1%8F-%D1%86%D0%B5%D0%BD%D0%B0-%D0%BD%D0%B0-%D0%BE%D0%B7%D0%BE%D0%BD-%D0%B8-%D0%B2%D0%B1/";
            const operaStore = "https://chromewebstore.google.com/detail/afjklofdihcdbbbmppgbigjmkclglcbc?utm_source=item-share-cb";
            
            if (userAgent.includes("opr/") || userAgent.includes("opera")) {
                window.location.href = operaStore;
            } else if (userAgent.includes("firefox") || userAgent.includes("fxios")) {
                window.location.href = firefoxStore;
            } else {
                window.location.href = chromeStore;
            }
        };
    </script>
</head>
<body>
</body>
</html>
